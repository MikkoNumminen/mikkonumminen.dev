<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="proj-bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0a1230"/>
      <stop offset="60%" stop-color="#040818"/>
      <stop offset="100%" stop-color="#01030a"/>
    </radialGradient>
    <radialGradient id="proj-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0c8"/>
      <stop offset="40%" stop-color="#ffc865" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffc865" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="proj-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#80a8ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#80a8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#80a8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#proj-bg)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="1" opacity="0.7"/>
    <circle cx="240" cy="150" r="0.8" opacity="0.5"/>
    <circle cx="180" cy="240" r="1.2" opacity="0.85"/>
    <circle cx="60" cy="320" r="0.9" opacity="0.6"/>
    <circle cx="100" cy="500" r="0.8" opacity="0.5"/>
    <circle cx="80" cy="560" r="1.2" opacity="0.85"/>
    <circle cx="1060" cy="120" r="0.8" opacity="0.5"/>
    <circle cx="1140" cy="220" r="1" opacity="0.65"/>
    <circle cx="1020" cy="380" r="1.1" opacity="0.75"/>
    <circle cx="1100" cy="500" r="1" opacity="0.6"/>
    <circle cx="1050" cy="580" r="0.9" opacity="0.55"/>
  </g>

  <!-- Twin planetary orbits — left and right of the title for symmetry,
       so the centre stripe carries the wordmark cleanly. -->
  <g transform="translate(180,315)">
    <ellipse cx="0" cy="0" rx="90" ry="22" fill="none" stroke="#80a8ff" stroke-width="1" opacity="0.28"/>
    <circle cx="0" cy="0" r="32" fill="url(#proj-sun)"/>
    <circle cx="0" cy="0" r="14" fill="#fff0c8"/>
    <circle cx="78" cy="-6" r="9" fill="#5b8def"/>
  </g>

  <g transform="translate(1020,315)">
    <ellipse cx="0" cy="0" rx="100" ry="26" fill="none" stroke="#f5a25b" stroke-width="1" opacity="0.28"/>
    <ellipse cx="0" cy="0" rx="150" ry="40" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.22"/>
    <circle cx="-84" cy="14" r="11" fill="#f5a25b"/>
    <circle cx="138" cy="22" r="9" fill="#4ade80"/>
  </g>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="600" y="200" font-family="ui-monospace, SFMono-Regular, monospace" font-size="22" letter-spacing="6" fill="#80a8ff" opacity="0.7">PROJECTS</text>
    <text x="600" y="330" font-size="100" font-weight="700" letter-spacing="-2.5">Pick a planet.</text>
    <text x="600" y="390" font-family="ui-monospace, SFMono-Regular, monospace" font-size="22" fill="#c4d4ff" opacity="0.75" letter-spacing="2">an interactive solar system of work</text>
  </g>

  <rect x="380" y="430" width="440" height="1.5" fill="url(#proj-line)"/>

  <text x="600" y="485" font-family="ui-monospace, SFMono-Regular, monospace" font-size="20" fill="#80a8ff" opacity="0.7" letter-spacing="2" text-anchor="middle">mikkonumminen.dev/projects</text>
</svg>

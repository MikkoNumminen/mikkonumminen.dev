# One-command stack for the portfolio RAG chat (build brief Phase 5 + ADR 0009).
# Brings up the whole backend on Mikko's own machine: a local Postgres+pgvector,
# a GPU-accelerated Ollama serving the local model (qwen2.5:7b by default), the
# FastAPI backend, and an OPTIONAL Cloudflare Tunnel (behind the `tunnel`
# profile) to publish it.
#
#   make up            # db + ollama (+ pull model) + backend
#   make index         # one-time: embed the content corpus
#   make up-public     # also start the cloudflared tunnel
#   make down          # stop everything (volumes persist)
#
# Prerequisite: nvidia-container-toolkit so the ollama container can use the GPU
# (on Windows this is installed via WSL2). See chat-backend/README.md.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d rag']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  ollama:
    # Pinned to :latest deliberately — keep Ollama current so recent models (the
    # default qwen2.5:7b, or a newer one swapped in) stay supported. Pin a digest
    # once a known-good version is established if strict reproducibility is wanted.
    image: ollama/ollama:latest
    environment:
      # Served context window. The ragctl CLI sets this via the repo .env to
      # change "context"; the default matches Ollama's own (4096). A larger
      # context costs more VRAM per loaded model.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
    volumes:
      # Named volume persists the pulled model across restarts, so the model is
      # only downloaded once.
      - ollama:/root/.ollama
    # GPU access — requires nvidia-container-toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  # One-shot init: ask the ollama server to pull the model into its volume, so a
  # bare `docker compose up` also works — not only `make up`. Idempotent (a
  # no-op once the model is cached). The backend waits for this to COMPLETE, so
  # it never starts before the model is usable. `ollama list` (the daemon
  # healthcheck) goes healthy before any model exists, which is why this gate is
  # needed in addition to it.
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ['pull', '${LLM_MODEL:-qwen2.5:7b}']
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'

  backend:
    build: ./chat-backend
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      OLLAMA_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      # The indexer reads the version-controlled corpus mounted read-only below.
      CONTENT_DIR: /content
      # In prod set this to the site origin(s), e.g. https://mikkonumminen.dev
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      # Force every answer into English regardless of the question's language.
      # Read by app/config.py; `ragctl english on|off` flips it via the repo .env.
      # Default on — without this line the container can't see the toggle at all.
      FORCE_ENGLISH: ${FORCE_ENGLISH:-1}
      # Opt-in per-request log (query + answer + retrieval scores). Empty = off
      # (repo default); `ragctl up` sets it to the bind-mounted path below, so
      # RAG Control records the chat. See chat-backend/app/request_log.py.
      RAG_LOG_FILE: ${RAG_LOG_FILE:-}
    volumes:
      # The fastembed ONNX weights are baked into the image (see chat-backend/
      # Dockerfile), so no cache volume is needed.
      - ./content:/content:ro
      # Persist the request log on the host so it survives container rebuilds.
      # ragctl creates + world-writes this dir (the backend writes as uid 10001).
      - ${RAG_LOG_DIR:-./rag-logs}:/srv/rag-logs
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    # Bind to loopback only — `make up` is a LOCAL backend; other hosts on the
    # LAN shouldn't reach it. cloudflared talks to it over the internal Docker
    # network (service name `backend`), so the tunnel path is unaffected.
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      # Cheap liveness: just confirm uvicorn is accepting connections. Do NOT
      # hit /health here — it runs a real 1-token LLM completion, so a 5s probe
      # would hammer the model. python is in the image; curl is not.
      test:
        - CMD
        - python
        - "-c"
        - "import socket; socket.create_connection(('localhost', 8000), timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  tunnel:
    # :latest — cloudflared updates frequently; pin a digest if you need
    # reproducibility.
    image: cloudflare/cloudflared:latest
    # Named-tunnel token from the Cloudflare dashboard (see .env.example). Only
    # runs under the `tunnel` profile, so the backend is reachable publicly only
    # when Mikko explicitly opts in (`make up-public`). `:-` (empty default, not
    # `:?`) so `make up` without a token still parses — cloudflared errors
    # clearly at runtime if the tunnel is started with no token.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on:
      # Wait for the backend to be serving (its healthcheck), not just started,
      # so a public request through the tunnel can't hit a connection-refused
      # during uvicorn startup.
      backend:
        condition: service_healthy
    profiles: ['tunnel']
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
  # The former `fastembed` cache volume was removed — the ONNX weights are baked
  # into the backend image now. An existing host may still have an orphaned
  # `<project>_fastembed` volume; it holds only model weights and is safe to
  # `docker volume rm`.

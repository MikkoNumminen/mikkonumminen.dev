# One-command stack for the portfolio RAG chat (build brief Phase 5 + ADR 0009).
# Brings up the whole backend on Mikko's own machine: a local Postgres+pgvector,
# a GPU-accelerated Ollama serving the local model (qwen2.5:7b by default), the
# FastAPI backend, and an OPTIONAL Cloudflare Tunnel (behind the `tunnel`
# profile) to publish it.
#
#   make up            # db + ollama (+ pull model) + backend
#   make index         # one-time: embed the content corpus
#   make up-public     # also start the cloudflared tunnel
#   make down          # stop everything (volumes persist)
#
# Prerequisite: nvidia-container-toolkit so the ollama container can use the GPU
# (on Windows this is installed via WSL2). See chat-backend/README.md.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d rag']
      interval: 5s
      timeout: 3s
      retries: 12
    # `always`, not `unless-stopped`: a Docker Desktop update stops every
    # container cleanly and starts the engine again, and `unless-stopped` reads
    # a clean stop as "somebody turned this off", so nothing came back. `ragctl
    # down` is `compose down`, and a container that no longer exists is not
    # restarted by anything, so switching the rag off on purpose still sticks.
    restart: always

  ollama:
    # Pinned to :latest deliberately — keep Ollama current so recent models (the
    # default qwen2.5:7b, or a newer one swapped in) stay supported. Pin a digest
    # once a known-good version is established if strict reproducibility is wanted.
    image: ollama/ollama:latest
    environment:
      # Served context window. The ragctl CLI sets this via the repo .env to
      # change "context"; the default matches Ollama's own (4096). A larger
      # context costs more VRAM per loaded model.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
    volumes:
      # Named volume persists the pulled model across restarts, so the model is
      # only downloaded once.
      - ollama:/root/.ollama
    # GPU access — requires nvidia-container-toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 24
    restart: always

  # One-shot init: ask the ollama server to pull the model into its volume, so a
  # bare `docker compose up` also works — not only `make up`. Idempotent (a
  # no-op once the model is cached). The backend waits for this to COMPLETE, so
  # it never starts before the model is usable. `ollama list` (the daemon
  # healthcheck) goes healthy before any model exists, which is why this gate is
  # needed in addition to it.
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ['pull', '${LLM_MODEL:-qwen2.5:7b}']
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'

  backend:
    build: ./chat-backend
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      OLLAMA_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      # The indexer reads the version-controlled corpus mounted read-only below.
      CONTENT_DIR: /content
      # Phase 1: also ingest the repo's ADRs / design notes (bind-mounted below)
      # as doc_type='adr' prose, attributed to the portfolio project. Plain-dash
      # (not :-) so `ADR_DIR=` in the env passes an empty value through and the
      # indexer skips ADR ingestion (the bind-mount below is then just unused,
      # harmless). The indexer reads this; the runtime backend never does.
      ADR_DIR: ${ADR_DIR-/adr}
      # In prod set this to the site origin(s), e.g. https://mikkonumminen.dev
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      # Force every answer into English regardless of the question's language.
      # Read by app/config.py; `ragctl english on|off` flips it via the repo .env.
      # Default on — without this line the container can't see the toggle at all.
      FORCE_ENGLISH: ${FORCE_ENGLISH:-1}
      # Shoutbox (contact page). Default OFF: POST /shout 404s until switched on,
      # because the funnel exposes every route the moment the stack is up. Without
      # these three lines the container can't see the toggle or the notifier at all.
      SHOUTBOX_ENABLED: ${SHOUTBOX_ENABLED:-0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # EXPERIMENTAL (default off): answer Finnish-looking questions in Finnish
      # instead of forcing English. Off keeps English-only behavior. Without this
      # line the container can't see the toggle at all.
      RAG_ALLOW_FINNISH: ${RAG_ALLOW_FINNISH:-0}
      # Retrieve a Finnish question via a model-generated English translation
      # (the embedder + lexical index are English-only); the answer still
      # addresses the original question. Without this line the container can't
      # see the toggle at all.
      RAG_TRANSLATE_RETRIEVAL: ${RAG_TRANSLATE_RETRIEVAL:-0}
      # Research/recency coverage: force this many NEWEST research posts (by
      # doc_date) into context on a "latest research" question, so pure similarity
      # plus the per-project diversity cap can't bury them. 0 disables. Without this
      # line the container can't see the toggle — the config default (3) still
      # applies, but it can't be tuned via the repo .env.
      RESEARCH_COVERAGE_TOP_N: ${RESEARCH_COVERAGE_TOP_N:-3}
      # The retrieval + disclosure behaviour dials. Until these lines existed the
      # container could not see them at all: setting PROGRESSIVE_DISCLOSURE_ENABLED
      # in the repo .env changed nothing, silently, because the value never
      # crossed into the process and config.py's default stood. `ragctl feature`
      # toggles these, and it can only do so if they are threaded here — a knob
      # missing from this block is a knob that cannot be controlled, no matter
      # what .env says.
      PROGRESSIVE_DISCLOSURE_ENABLED: ${PROGRESSIVE_DISCLOSURE_ENABLED:-1}
      HYBRID_ENABLED: ${HYBRID_ENABLED:-true}
      PROJECT_FILTER_STRICT: ${PROJECT_FILTER_STRICT:-true}
      RETRIEVAL_DIVERSITY_MAX_PER_PROJECT: ${RETRIEVAL_DIVERSITY_MAX_PER_PROJECT:-3}
      # Plain dash, NOT `:-`. `${VAR:-adr}` substitutes when the var is unset OR
      # EMPTY, and empty is meaningful here: config.py reads "" as "no doc-type
      # filter at all", while unset means the "adr" default. With `:-` that
      # opt-out becomes unreachable — setting the var empty in .env would
      # silently come back as "adr". Same reasoning as ADR_DIR above.
      RETRIEVAL_EXCLUDE_DOC_TYPES: ${RETRIEVAL_EXCLUDE_DOC_TYPES-adr}
      # Per-request operational log — timestamp, route, latency, token counts, and
      # retrieval distances; NO query/answer text, so no PII. On by default (set
      # RAG_LOG_FILE empty to disable); `ragctl up` may override it with the
      # bind-mounted path below. RAG_LOG_TEXT=true additionally logs the raw
      # query+answer (PII, off by default). See chat-backend/app/request_log.py.
      RAG_LOG_FILE: ${RAG_LOG_FILE:-/srv/rag-logs/requests.jsonl}
      RAG_LOG_TEXT: ${RAG_LOG_TEXT:-}
      # Mirrors OLLAMA_CONTEXT_LENGTH so the backend can emit the real num_ctx
      # in the `context` SSE frame that drives the frontend context-window donut.
      CONTEXT_WINDOW: ${OLLAMA_CONTEXT_LENGTH:-4096}
    volumes:
      # The fastembed ONNX weights are baked into the image (see chat-backend/
      # Dockerfile), so no cache volume is needed.
      - ./content:/content:ro
      # The repo's ADRs / design notes, read-only — the Phase 1 corpus expansion
      # ingests them as design-decision prose (see ADR_DIR above).
      - ./docs/decisions:/adr:ro
      # Persist the request log on the host so it survives container rebuilds.
      # ragctl creates + world-writes this dir (the backend writes as uid 10001).
      - ${RAG_LOG_DIR:-./rag-logs}:/srv/rag-logs
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    # Bind to loopback only — `make up` is a LOCAL backend; other hosts on the
    # LAN shouldn't reach it. cloudflared talks to it over the internal Docker
    # network (service name `backend`), so the tunnel path is unaffected.
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      # Cheap liveness: just confirm uvicorn is accepting connections. Do NOT
      # hit /health here — it runs a real 1-token LLM completion, so a 5s probe
      # would hammer the model. python is in the image; curl is not.
      test:
        - CMD
        - python
        - "-c"
        - "import socket; socket.create_connection(('localhost', 8000), timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: always

  tunnel:
    # :latest — cloudflared updates frequently; pin a digest if you need
    # reproducibility.
    image: cloudflare/cloudflared:latest
    # Named-tunnel token from the Cloudflare dashboard (see .env.example). Only
    # runs under the `tunnel` profile, so the backend is reachable publicly only
    # when Mikko explicitly opts in (`make up-public`). `:-` (empty default, not
    # `:?`) so `make up` without a token still parses — cloudflared errors
    # clearly at runtime if the tunnel is started with no token.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on:
      # Wait for the backend to be serving (its healthcheck), not just started,
      # so a public request through the tunnel can't hit a connection-refused
      # during uvicorn startup.
      backend:
        condition: service_healthy
    profiles: ['tunnel']
    restart: always

volumes:
  pgdata:
  ollama:
  # The former `fastembed` cache volume was removed — the ONNX weights are baked
  # into the backend image now. An existing host may still have an orphaned
  # `<project>_fastembed` volume; it holds only model weights and is safe to
  # `docker volume rm`.

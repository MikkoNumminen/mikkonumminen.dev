[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-rag-backend"
version = "0.1.0"
description = "Local RAG chat backend for the portfolio terminal (FastAPI + pgvector + Ollama)."
requires-python = ">=3.12"
# Runtime dependencies: the offline indexer (asyncpg/pgvector/fastembed) plus
# the retrieval/generation API (fastapi/uvicorn for serving, httpx for the
# Ollama OpenAI-compatible client).
dependencies = [
    "asyncpg>=0.29",
    "pgvector>=0.3",
    # Pinned (not >=) on purpose: the offline model bake in chat-backend/Dockerfile
    # depends on this exact version's cache layout + HF-offline behaviour. Keep in
    # sync with the `pip install "fastembed==..."` line in the Dockerfile.
    "fastembed==0.8.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    # Statistical language ID for the Finnish answer-path routing
    # (guardrails.looks_finnish). Offline, CPU-only; the EN/FI/SV models load
    # lazily on the first detection, never at import.
    "lingua-language-detector>=2.1",
]

[project.optional-dependencies]
# PINNED, not floored, and the distinction is load-bearing.
#
# These were `>=` ranges, so CI resolved whatever was newest while a developer
# machine kept whatever it installed months ago. PR #492 failed CI on ruff UP042
# after `ruff check .` passed locally, with no code difference between the two
# runs: CI had ruff 0.16.1, this laptop had 0.6.9, and the rule had graduated out
# of preview in between. A gate that can be green locally and red in CI for
# reasons invisible in the diff trains you to skim past the word "error".
#
# Exact pins make `pip install -e ".[dev]"` reproduce the same checkers
# everywhere. The cost is that they go stale on their own, which is why
# .github/dependabot.yml now watches this file — a graduating lint rule arrives
# as a reviewable PR rather than as a surprise on an unrelated branch.
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
    "mypy==2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# `pythonpath = ["."]` lets the suite import `app.*` when run from this
# directory without installing the package — the pure-logic tests (chunking,
# content, config) then run on any Python 3.11+ with just pytest, no heavy deps.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# pipeline.py documents two module constants + the UsageRecorder type alias inline
# (with their rationale) between the stdlib and the local imports — a deliberate
# readability choice. Suppress imports-not-at-top for this file only, not project-wide.
"app/pipeline.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
# Both things this checks run on Linux: the backend in its container, and
# ragctl inside WSL. Without this pin mypy assumes the HOST platform, and a
# Windows host resolves a different typeshed `readline` stub — producing four
# errors locally that CI never sees. That is the same local-vs-CI divergence
# the pinned tool versions below exist to prevent, so pin the platform too.
platform = "linux"
strict = true
# fastembed / pgvector ship without complete type stubs; don't fail the strict
# run on third-party gaps we don't control.
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-rag-backend"
version = "0.1.0"
description = "Local RAG chat backend for the portfolio terminal (FastAPI + pgvector + Ollama)."
requires-python = ">=3.12"
# Runtime dependencies: the offline indexer (asyncpg/pgvector/fastembed) plus
# the retrieval/generation API (fastapi/uvicorn for serving, httpx for the
# Ollama OpenAI-compatible client).
dependencies = [
    "asyncpg>=0.29",
    "pgvector>=0.3",
    # Pinned (not >=) on purpose: the offline model bake in chat-backend/Dockerfile
    # depends on this exact version's cache layout + HF-offline behaviour. Keep in
    # sync with the `pip install "fastembed==..."` line in the Dockerfile.
    "fastembed==0.8.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    # Statistical language ID for the Finnish answer-path routing
    # (guardrails.looks_finnish). Offline, CPU-only; the EN/FI/SV models load
    # lazily on the first detection, never at import.
    "lingua-language-detector>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# `pythonpath = ["."]` lets the suite import `app.*` when run from this
# directory without installing the package — the pure-logic tests (chunking,
# content, config) then run on any Python 3.11+ with just pytest, no heavy deps.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# pipeline.py documents two module constants + the UsageRecorder type alias inline
# (with their rationale) between the stdlib and the local imports — a deliberate
# readability choice. Suppress imports-not-at-top for this file only, not project-wide.
"app/pipeline.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
# fastembed / pgvector ship without complete type stubs; don't fail the strict
# run on third-party gaps we don't control.
ignore_missing_imports = true

# Dependabot keeps dependencies and CI actions current and surfaces security
# advisories as update PRs. Grouped so a quiet week produces one PR, not ten.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript 7 (major) is held: `npm run typecheck` runs astro check via
      # @astrojs/check, whose typescript peer is "^5 || ^6", so a TS7 bump makes
      # `npm ci` fail on the ERESOLVE peer conflict (this is what turned the
      # first dev-group PR red in ~7s, before any script ran). Remove this entry
      # once @astrojs/check ships a release that peers typescript 7.
      # Re-checked 2026-08-02 against 0.9.10 (latest): peer is still
      # "^5.0.0 || ^6.0.0", so the hold stands. Verify with
      # `npm view @astrojs/check peerDependencies` before removing it — a bump
      # to @astrojs/check alone is not evidence the peer moved.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # three is held at 0.185.x: `postprocessing` (the home field's bloom)
      # peers "three >= 0.168 < 0.186", so a 0.186+ bump makes `npm ci` fail
      # on the ERESOLVE peer conflict. Remove this entry once
      # pmndrs/postprocessing ships a release that widens the peer range.
      # Re-checked 2026-08-02 against 6.39.4 (latest): peer is still
      # ">= 0.168.0 < 0.186.0", so the hold stands. Verify with
      # `npm view postprocessing peerDependencies` before removing it.
      - dependency-name: 'three'
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The RAG backend's Python deps. Added when chat-backend/pyproject.toml moved
  # its dev tools from `>=` floors to exact pins: pinning is what stops CI and a
  # developer machine running different checkers, but an unwatched pin just goes
  # stale instead, and a graduating lint rule then arrives as a surprise on an
  # unrelated branch. Grouped so a quiet week is one PR.
  - package-ecosystem: pip
    directory: /chat-backend
    schedule:
      interval: weekly
    groups:
      backend-dev-tools:
        dependency-type: development
      backend-runtime:
        dependency-type: production
  # chat-backend/Dockerfile pins `python:3.12-slim`. Same rationale as the pip
  # entry above: an unwatched base-image tag just goes stale instead.
  - package-ecosystem: docker
    directory: /chat-backend
    schedule:
      interval: weekly

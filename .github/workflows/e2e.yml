name: E2E

# Browser-level scene smoke: the verification the unit gates structurally can't
# do (the product is WebGL/GSAP, which jsdom can't run). Builds the site and
# loads each of the four worlds in headless Chromium (WebGL via SwiftShader),
# asserting each boots without console/page errors and its canvas mounts.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenes:
    name: Scene smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The home page bakes recent commit subjects into its HTML at
          # build time (src/page-content/HomePage.astro). At checkout's
          # default depth of 1 that git log returns a single commit, so a
          # CI build produces a page that cannot represent what the
          # feature does. 25 is enough history for the 20 it reads
          # without cloning the whole repo on every run.
          fetch-depth: 25
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

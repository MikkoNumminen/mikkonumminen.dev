name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: the gate only reads the repo. No write scope on GITHUB_TOKEN.
permissions:
  contents: read

# Cancel a superseded run on the same ref so rapid pushes don't pile up
# redundant CI (and don't waste minutes racing each other).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

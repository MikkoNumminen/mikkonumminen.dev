name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: the gate only reads the repo. No write scope on GITHUB_TOKEN.
permissions:
  contents: read

# Cancel a superseded run on the same ref so rapid pushes don't pile up
# redundant CI (and don't waste minutes racing each other).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The home page bakes recent commit subjects into its HTML at
          # build time (src/page-content/HomePage.astro). At checkout's
          # default depth of 1 that git log returns a single commit, so a
          # CI build produces a page that cannot represent what the
          # feature does. 25 is enough history for the 20 it reads
          # without cloning the whole repo on every run.
          fetch-depth: 25
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  # The RAG backend (chat-backend/) — Python — was never CI-checked, so latent
  # ruff/mypy nits stayed latent and the whole check rode on local runs + memory.
  #
  # `chat-backend` is currently the ONLY required status check in branch
  # protection. `check` (this file's other job), the E2E `scenes` job, and
  # CodeQL all run on every PR but do NOT block a merge — a PR can go red on
  # typecheck, lint, tests, build or E2E and still be mergeable.
  #
  # To make them block, add these exact context names to the required list
  # (Settings > Branches, or `gh api --method PATCH
  # repos/OWNER/REPO/branches/master/protection/required_status_checks`):
  #   check
  #   Scene smoke (Playwright)
  #   Analyze (javascript-typescript)
  #   Analyze (python)
  #
  # ADD A CONTEXT ONLY AFTER YOU HAVE SEEN IT REPORT GREEN AT LEAST ONCE. A
  # required context that never reports blocks every PR forever, and that is not
  # hypothetical here: the two Analyze legs produced no check-runs at all for
  # three commits after a malformed concurrency block made codeql.yml fail to
  # parse. Check `gh api repos/OWNER/REPO/commits/master/check-runs` and require
  # only names you can see in that output.
  #
  # THESE ARE DISPLAY NAMES, NOT JOB IDS, and the difference bites: the E2E job's
  # id is `scenes` but it sets `name: Scene smoke (Playwright)`, and GitHub
  # reports the status context under the display name when one is set. Requiring
  # `scenes` would wait forever on a context that never arrives and block every
  # PR. Same for the two Analyze legs, whose names come from the codeql.yml
  # matrix. Rename a job and you must update the required list in the same
  # change, or merges stop.
  chat-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chat-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: chat-backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app evals ragctl.py
      - run: pytest

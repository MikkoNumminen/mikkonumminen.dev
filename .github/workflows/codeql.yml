name: CodeQL

# Static security analysis of the TS/JS surface — the hard security gate the
# threat model called for (Dependabot alone is advisory-only). Free on public
# repos. Runs on pushes, PRs, and a weekly schedule to catch advisories that
# land in dependencies between commits.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

name: CodeQL

# Static security analysis of the TS/JS surface — the hard security gate the
# threat model called for (Dependabot alone is advisory-only). Free on public
# repos. Runs on pushes, PRs, and a weekly schedule to catch advisories that
# land in dependencies between commits.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload results to the Security tab
    # JOB-level, not workflow-level. `matrix` only exists inside a job, so a
    # workflow-level group referencing it is not a bad key — it makes the whole
    # file fail to parse, and GitHub reports that as a run with zero jobs rather
    # than as a syntax error. It silently produced no check-runs at all for
    # three commits, which meant no security scanning and, worse, would have
    # deadlocked every PR if the Analyze contexts had been marked required in
    # the meantime. Keep this block inside the job.
    concurrency:
      group: codeql-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # Deepest first-party suite: the default security queries plus the
          # extended security set and maintainability/quality checks. Worth the
          # extra analysis time on a small surface to catch more before merge.
          queries: security-and-quality
          # `content/code/` is curated third-party project source the RAG backend
          # indexes — corpus data, not this site's code. Exclude it from analysis
          # (mirrors the tsconfig/eslint/prettier excludes) so findings in other
          # repos' code don't gate this repo's PRs.
          config: |
            paths-ignore:
              - content/code
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
